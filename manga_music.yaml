substitutions:
    startup_sound_file: https://github.com/RASPIAUDIO/esphomeLuxe/raw/refs/heads/main/wav/sounds_timer_finished.wav    

esphome:
  name: manga-music
  friendly_name: Raspiaudio Manga Music
  min_version: 2026.5.0
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - script.execute: led_red
      - component.update: my_display
      
  project:
    name: raspiaudio.manga-music-assistant
    version: "2026.8.4"
    
esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      # Le bootloader présent le supporte; fournit 40 Ko d'IRAM supplémentaires.
      sram1_as_iram: true
      include_builtin_idf_components:
        - esp_http_client

logger:
  level: warn

api:
  # Le lecteur Sendspin doit continuer à fonctionner même sans client HA connecté.
  reboot_timeout: 0s
  on_client_connected:
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, std::string("ready_sound"));
          }
        }
        
font:
  - file: "gfonts://Roboto Mono"
    id: ui_font_small
    size: 12
    bpp: 1
    glyphs:
      - " "
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "0123456789"
      - ".,;:!?-_/\\()[]{}<>|@#&+=*\"'%"
      - "°"
      - "àâäáãåçéèêëíìîïñóòôöõúùûüýÿ"
      - "ÀÂÄÁÃÅÇÉÈÊËÍÌÎÏÑÓÒÔÖÕÚÙÛÜÝ"
      - "œŒæÆ"
  - file: "gfonts://Roboto Mono"
    id: ui_font_volume
    size: 8
    bpp: 1
    glyphs:
      - " "
      - "VOL"
      - "ACEPRSTU"
      - "0123456789"
      - "%"
  
wifi:
#  ssid: 
#  password: 
  # Évite les micro-sommeils radio susceptibles de vider le buffer Sendspin.
  power_save_mode: none
  ap:
    ssid: "mangamusic"
    password: "12345678"

psram:
  mode: quad
  speed: 80MHz
  
ota:                 
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request  
update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://raw.githubusercontent.com/RASPIAUDIO/esphomeMangaCastMusic/main/manifest_update.json   

http_request:
  
captive_portal:

improv_serial: 

external_components:
  - source:
      type: local
      path: components
    components: [audio_output_router]

i2c:
  sda: GPIO18
  scl: GPIO23
  # Un rafraîchissement plein écran passe d'environ 100 ms à environ 25 ms.
  frequency: 400kHz
  id: bus_a
   
display:
  - platform: ssd1306_i2c
    id: my_display
    model: "SH1106_128x64"
    address: 0x3C
    # Une seule mise à jour groupée; les trois métadonnées ne doivent pas
    # déclencher trois transferts I²C consécutifs.
    update_interval: 1s
    lambda: |-
      const int visible_chars = 17;
      const uint32_t now = millis();
      it.fill(COLOR_OFF);

      auto utf8_length = [](const std::string &text) -> size_t {
        size_t length = 0;
        for (unsigned char byte : text) {
          if ((byte & 0xC0) != 0x80) length++;
        }
        return length;
      };
      auto utf8_byte_index = [](const std::string &text, size_t character_index) -> size_t {
        size_t characters = 0;
        for (size_t byte_index = 0; byte_index < text.size(); byte_index++) {
          if ((static_cast<unsigned char>(text[byte_index]) & 0xC0) != 0x80) {
            if (characters == character_index) return byte_index;
            characters++;
          }
        }
        return text.size();
      };
      auto scroll_text = [&](const std::string &text) -> std::string {
        if (text.empty()) return std::string("");
        const size_t character_count = utf8_length(text);
        if (character_count <= visible_chars) return text;
        const int max_offset = character_count - visible_chars;
        const int step = (now / 300);
        const int period = (max_offset + 2) * 2;
        int offset = (period > 0) ? (step % period) : 0;
        if (offset > max_offset) offset = period - offset;
        if (offset > max_offset) offset = max_offset;
        const size_t begin = utf8_byte_index(text, offset);
        const size_t end = utf8_byte_index(text, offset + visible_chars);
        return text.substr(begin, end - begin);
      };
      auto is_valid = [&](const std::string &text) -> bool {
        return !text.empty() && text != "unknown" && text != "unavailable" && text != "None";
      };

      std::string title = id(selected_audio_output).get_title();
      std::string artist = id(selected_audio_output).get_artist();
      std::string album_name = id(selected_audio_output).get_album();
      float volume_level = id(sendspin_media_player).volume;

      if (!is_valid(title)) title = "";
      if (!is_valid(artist)) artist = "";
      if (!is_valid(album_name)) album_name = "";
      if (volume_level != volume_level) volume_level = 0.0f;

      int vol_percent = int(volume_level * 100.0f + 0.5f);
      if (vol_percent < 0) vol_percent = 0;
      if (vol_percent > 100) vol_percent = 100;
      const char *playback = "ARRET";
      using media_player::MediaPlayerState;
      if (id(sendspin_media_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING) playback = "LECT";
      else if (id(sendspin_media_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PAUSED) playback = "PAUSE";

      it.printf(64, 0, id(ui_font_small), TextAlign::TOP_CENTER, "%s", scroll_text(title).c_str());
      it.printf(64, 16, id(ui_font_small), TextAlign::TOP_CENTER, "%s", scroll_text(artist).c_str());
      it.printf(64, 32, id(ui_font_small), TextAlign::TOP_CENTER, "%s", scroll_text(album_name).c_str());
      it.printf(0, 55, id(ui_font_volume), TextAlign::TOP_LEFT, "%s", playback);
      it.printf(127, 55, id(ui_font_volume), TextAlign::TOP_RIGHT, "VOL %d%%", vol_percent);

i2s_audio:
  - id: analog_i2s_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin:  GPIO5
  - id: spdif_i2s_bus

speaker:
  - platform: i2s_audio
    id: analog_speaker
    i2s_audio_id: analog_i2s_bus
    i2s_dout_pin: GPIO26
    dac_type: external
    channel: stereo
    sample_rate: 48000
    buffer_duration: 300ms

  - platform: i2s_audio
    id: spdif_speaker
    i2s_audio_id: spdif_i2s_bus
    i2s_dout_pin: GPIO04
    dac_type: external
    channel: stereo
    sample_rate: 48000
    spdif_mode: true
    use_apll: true
    i2s_mode: primary
    i2s_comm_fmt: stand_i2s
    mclk_multiple: 256
    timeout: never
    buffer_duration: 300ms

  - platform: audio_output_router
    id: selected_audio_output
    analog_speaker: analog_speaker
    spdif_speaker: spdif_speaker
    sendspin_id: sendspin_hub
    bits_per_sample: 16
    num_channels: 2
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: selected_audio_output
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

  - platform: resampler
    id: media_resampling_input
    output_speaker: media_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input    
    sample_rate: 48000

sendspin:
  id: sendspin_hub

audio_file:
  - id: ready_sound
    file: ${startup_sound_file}

media_source:
  - platform: sendspin
    id: sendspin_source
    buffer_size: 2000000
  - platform: audio_file
    id: file_source

media_player:
  - platform: sendspin
    id: sendspin_media_player
    name: MangaCast
    volume_increment: 2%
  - platform: speaker_source
    name: MangaCast Audio
    id: external_media_player
    internal: true

    announcement_pipeline:
      speaker: announcement_resampling_input
      sources:
        - file_source
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_input
      sources:
        - sendspin_source
      format: FLAC
      num_channels: 2      
      sample_rate: 48000

    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.9
    on_state:
      then:
        - lambda: |-
            using media_player::MediaPlayerState;
            auto state = id(external_media_player).state;
            if (
              state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
              state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING
            ) {
              id(led_green).execute();
            } else {
              id(selected_audio_output).clear_metadata();
              id(led_red).execute();
            }
            
            
sensor:
  - platform: rotary_encoder
    name: "Volume"
    id: volume_encoder
    pin_a:
      number: GPIO19
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO32
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - media_player.volume_down: sendspin_media_player
    on_clockwise:
      then:
        - media_player.volume_up: sendspin_media_player

  - platform: adc
    pin: GPIO33 
    name: Battery
    icon: "mdi:battery-outline"
    update_interval: 15s
    accuracy_decimals: 3
    attenuation: 12db
    raw: true
    filters:
    - multiply: 0.00173913 # 2300 -> 4, for attenuation 11db, based on Olivier's code
    - exponential_moving_average:
        alpha: 0.2
        send_every: 2
    - delta: 0.002            
            
            
script:
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
  - id: led_red
    then:
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

  - id: led_green
    then:
      - light.turn_on:
          id: led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%

switch:
  - platform: template
    id: spdif_output_switch
    name: SPDIF
    icon: "mdi:toslink"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(selected_audio_output).set_spdif_enabled(true);
    turn_off_action:
      - lambda: id(selected_audio_output).set_spdif_enabled(false);

  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"
    
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO00
      inverted: true
      mode:
        input: true
        output: false
        open_drain: false
        pullup: true
        pulldown: false
      drive_strength: 20.0
    name: Button
    on_press:
      then:
        - media_player.toggle: sendspin_media_player


light:
  - platform: esp32_rmt_led_strip
    id: led
    name: LED light
    disabled_by_default: false
    entity_category: config
    pin: GPIO22
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
